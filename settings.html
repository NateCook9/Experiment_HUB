<main class="max-w-[1280px] mx-auto px-8 py-12">
    <h1 class="text-4xl font-bold text-primary mb-8">Account Settings</h1>
    
    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
            <div>
                <h3 class="font-bold">Profile Information</h3>
                <p class="text-sm text-on-surface-variant">Update your researcher bio and contact email.</p>
            </div>
            <button class="text-primary font-bold text-sm">Edit</button>
        </div>
        
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
            <div>
                <h3 class="font-bold">Notification Preferences</h3>
                <p class="text-sm text-on-surface-variant">Control when you receive alerts for new experiment data.</p>
            </div>
            <div class="w-12 h-6 bg-slate-200 rounded-full relative cursor-pointer">
                <div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full shadow-sm"></div>
            </div>
        </div>

        <div class="p-6 bg-slate-50">
            <button class="text-red-600 font-bold text-sm flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px]">delete</span>
                Delete Account
            </button>
        </div>
    </div>
</main>
